<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torah MiTzion 30 — Back office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../tmz-mark.png">
<link rel="stylesheet" href="../fonts.css?v=2880df4ewb">
<link rel="stylesheet" href="admin.css?v=2880df4ewb">
<script src="config.js?v=2880df4ewb"></script>
</head>
<body>
<div id="app"><div class="boot">Loading…</div></div>
<script>
/* A module that fails to parse never runs at all, and the page would sit on
   "Loading…" for ever with the reason only in the console — which is how a
   stray character in sb.js once closed the back office to everybody. Put the
   error where the person looking at the screen can read it. */
addEventListener('error', function (e) {
  if (!e.message) return;                     // a missing image, not a broken script
  var boot = document.querySelector('.boot');
  if (boot) boot.textContent = 'The back office could not start: ' + e.message;
}, true);
</script>
<script type="module" src="app.js?v=2880df4ewb"></script>
</body>
</html>
